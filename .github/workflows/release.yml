# Publication : pousser un tag vX.Y.Z identique à la version de package.json.
#   git tag v0.4.1 && git push origin v0.4.1
# Ne pas créer la release GitHub à la main : le workflow s'en charge (et complète
# une release existante si besoin).
#
# Relance manuelle (Actions › Release › Run workflow, tag = v0.4.0) : rejoue la
# publication d'un tag existant. Idempotent : une version déjà publiée sur le
# Marketplace ou Open VSX est ignorée (--skip-duplicate), la release GitHub est
# créée ou complétée.
#
# Aucun secret requis : Marketplace et Open VSX en Trusted Publishing (OIDC).
# Le nom de ce fichier (release.yml) et les environnements doivent correspondre
# aux politiques déclarées sur le Marketplace et sur Open VSX.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à (re)publier, ex. v0.4.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npx vsce package --no-dependencies -o readable-tests.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: readable-tests.vsix

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: npx vsce publish --oidc --skip-duplicate --packagePath readable-tests.vsix

  openvsx:
    needs: build
    runs-on: ubuntu-latest
    environment: openvsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      # Trusted Publishing par défaut ; un secret OVSX_PAT éventuel reste utilisable en secours.
      - env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish readable-tests.vsix --skip-duplicate -p "$OVSX_PAT"
          else
            unset OVSX_PAT
            npx ovsx publish readable-tests.vsix --skip-duplicate --trusted-publishing
          fi

  # Ne dépend que du Marketplace : un échec Open VSX (namespace non vérifié…) ne bloque pas la release.
  github-release:
    needs: [build, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file="readable-tests-$VERSION.vsix"
          mv readable-tests.vsix "$file"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$file" --title "$TAG" --notes-file notes.md
          fi
