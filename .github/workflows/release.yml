# Publication : pousser un tag vX.Y.Z identique à la version de package.json.
#   git tag v0.4.0 && git push origin v0.4.0
# Aucun secret requis : Marketplace et Open VSX en Trusted Publishing (OIDC).
# Le nom de ce fichier (release.yml) et les environnements doivent correspondre
# aux politiques déclarées sur le Marketplace et sur Open VSX.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npx vsce package --no-dependencies -o readable-tests.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: readable-tests.vsix

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - run: npx vsce publish --oidc --packagePath readable-tests.vsix

  openvsx:
    needs: build
    runs-on: ubuntu-latest
    environment: openvsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      # Trusted Publishing par défaut ; un secret OVSX_PAT éventuel reste utilisable en secours.
      - env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish readable-tests.vsix -p "$OVSX_PAT"
          else
            unset OVSX_PAT
            npx ovsx publish readable-tests.vsix --trusted-publishing
          fi

  github-release:
    needs: [build, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv readable-tests.vsix "readable-tests-${{ needs.build.outputs.version }}.vsix"
          notes=$(awk -v v="${{ needs.build.outputs.version }}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "readable-tests-${{ needs.build.outputs.version }}.vsix" \
            --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
